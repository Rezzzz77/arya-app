name = "arya-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
observability = { enabled = true }

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[vars]
# کلید جمینای این اپ همان کلید اپ نیوشانک است → سهمیهٔ مدل مشترک است.
# 4xx/429 مدیریت می‌شود و در صورت اتمام سهمیه به گزارش محلی برمی‌گردد.
AI_PROVIDER = "gemini"
AI_BASE_URL = "https://generativelanguage.googleapis.com/v1beta"
AI_MODEL = "gemini-3.5-flash-lite"
DAILY_LIMIT = "10"
APP_NAME = "مشاور زیبایی سلاطین یار"

[[d1_databases]]
binding = "DB"
database_name = "arya-app-db"
database_id = "5a4cf38f-fb45-4bf1-af0b-8e045758a4ce"

[[kv_namespaces]]
binding = "CACHE"
id = "bf10c19e7a32477390d7f853a351a053"

[[queues.producers]]
binding = "AI_QUEUE"
queue = "arya-ai"

[[queues.consumers]]
queue = "arya-ai"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 2
